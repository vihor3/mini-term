<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mini-term · Orca 式目标壳原型 v2</title>
<style>
  html, body { margin: 0; }
</style>
</head>
<body>
<div id="mini-term-orca-mockup">
  <style>
    #mini-term-orca-mockup {
      color-scheme: light dark;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: light-dark(#202124, #e8e8e4);
      letter-spacing: 0;
      background: light-dark(#e9eae8, #0c0d0e);
    }

    #mini-term-orca-mockup * { box-sizing: border-box; }
    #mini-term-orca-mockup button { font: inherit; color: inherit; }

    #mini-term-orca-mockup .mt-window {
      max-width: 1480px;
      margin: 0 auto;
      height: min(720px, 86vh);
      min-height: 600px;
      overflow: hidden;
      border: 1px solid light-dark(#cfd0d2, #303236);
      border-radius: 8px;
      background: light-dark(#f7f7f6, #111213);
      box-shadow: 0 18px 50px light-dark(rgba(30, 31, 33, 0.12), rgba(0, 0, 0, 0.34));
    }

    /* ---------- titlebar ---------- */

    #mini-term-orca-mockup .mt-titlebar {
      height: 38px;
      display: grid;
      grid-template-columns: minmax(190px, 250px) minmax(0, 1fr) auto;
      align-items: center;
      border-bottom: 1px solid light-dark(#dadbdd, #292b2e);
      background: light-dark(#f0f0ef, #171819);
      user-select: none;
    }

    #mini-term-orca-mockup .mt-brand,
    #mini-term-orca-mockup .mt-title-current,
    #mini-term-orca-mockup .mt-title-actions {
      min-width: 0;
      display: flex;
      align-items: center;
    }

    #mini-term-orca-mockup .mt-brand { gap: 8px; padding: 0 11px; font-size: 12px; font-weight: 650; }

    #mini-term-orca-mockup .mt-brand-mark {
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      border-radius: 5px;
      color: light-dark(#ffffff, #111213);
      background: light-dark(#25272a, #e8e8e4);
    }

    #mini-term-orca-mockup .mt-brand-mark svg { width: 13px; height: 13px; stroke-width: 2.2; }

    #mini-term-orca-mockup .mt-title-current {
      justify-content: center;
      gap: 7px;
      padding: 0 12px;
      color: light-dark(#5f6165, #a2a4a8);
      font-size: 11px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    #mini-term-orca-mockup .mt-title-current strong {
      color: light-dark(#26272a, #deded9);
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #mini-term-orca-mockup .mt-title-actions { gap: 2px; padding-right: 7px; }

    #mini-term-orca-mockup .mt-icon-action,
    #mini-term-orca-mockup .mt-header-action,
    #mini-term-orca-mockup .mt-tab-action,
    #mini-term-orca-mockup .mt-context-action {
      display: inline-grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: light-dark(#67696d, #96989c);
      cursor: pointer;
    }

    #mini-term-orca-mockup .mt-icon-action { width: 28px; height: 28px; }

    #mini-term-orca-mockup .mt-icon-action:hover,
    #mini-term-orca-mockup .mt-header-action:hover,
    #mini-term-orca-mockup .mt-tab-action:hover,
    #mini-term-orca-mockup .mt-context-action:hover {
      color: light-dark(#202124, #eeeeea);
      background: light-dark(#e1e2e2, #26282a);
    }

    #mini-term-orca-mockup svg { width: 15px; height: 15px; stroke-width: 1.8; }

    /* ---------- shell ---------- */

    #mini-term-orca-mockup .mt-shell {
      height: calc(100% - 38px);
      display: grid;
      grid-template-columns: minmax(280px, 340px) minmax(0, 1fr) minmax(300px, 380px);
      min-width: 0;
    }

    /* ---------- left sidebar ---------- */

    #mini-term-orca-mockup .mt-sidebar {
      min-width: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid light-dark(#d8d9db, #292b2e);
      background: light-dark(#eeeeed, #18191a);
    }

    #mini-term-orca-mockup .mt-global-nav {
      padding: 8px 7px 7px;
      border-bottom: 1px solid light-dark(#d8d9db, #292b2e);
    }

    #mini-term-orca-mockup .mt-nav-entry {
      width: 100%;
      height: 30px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 8px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: light-dark(#55575b, #a2a4a8);
      font-size: 12px;
      text-align: left;
      cursor: pointer;
    }

    #mini-term-orca-mockup .mt-nav-entry:hover,
    #mini-term-orca-mockup .mt-nav-entry[aria-current="page"] {
      color: light-dark(#222326, #f0f0ec);
      background: light-dark(#dedfdf, #252729);
    }

    #mini-term-orca-mockup .mt-nav-entry svg { width: 14px; height: 14px; }
    #mini-term-orca-mockup .mt-nav-kbd {
      margin-left: auto;
      font-size: 9px;
      color: light-dark(#8b8d91, #696c70);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    #mini-term-orca-mockup .mt-projects-head {
      height: 39px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 8px 0 12px;
      border-bottom: 1px solid light-dark(#d8d9db, #292b2e);
    }

    #mini-term-orca-mockup .mt-projects-title {
      margin-right: auto;
      font-size: 12px;
      font-weight: 650;
      color: light-dark(#333438, #d7d7d2);
    }

    #mini-term-orca-mockup .mt-header-action { width: 25px; height: 25px; }

    #mini-term-orca-mockup .mt-worktree-scroll {
      min-height: 0;
      flex: 1;
      overflow: auto;
      padding: 0 7px 8px;
      scrollbar-width: thin;
    }

    #mini-term-orca-mockup .mt-worktree-group { margin-top: 4px; }

    #mini-term-orca-mockup .mt-group-heading {
      height: 26px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 6px;
      color: light-dark(#74767a, #777a7e);
      font-size: 10px;
      font-weight: 650;
      text-transform: uppercase;
    }

    #mini-term-orca-mockup .mt-group-heading svg { width: 12px; height: 12px; }

    #mini-term-orca-mockup .mt-worktree-row {
      width: 100%;
      min-height: 58px;
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) 22px;
      gap: 6px;
      padding: 7px 5px 7px 3px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      text-align: left;
      cursor: pointer;
      color: inherit;
      font: inherit;
    }

    #mini-term-orca-mockup .mt-worktree-row + .mt-worktree-row { margin-top: 2px; }

    #mini-term-orca-mockup .mt-worktree-row:hover { background: light-dark(#e2e3e2, #212325); }

    #mini-term-orca-mockup .mt-worktree-row[aria-selected="true"] {
      border-color: light-dark(#c7c9cb, #383a3e);
      background: light-dark(#ffffff, #252729);
      box-shadow: 0 1px 3px light-dark(rgba(0, 0, 0, 0.06), rgba(0, 0, 0, 0.24));
    }

    /* 断线覆盖态：降低对比度，不用红点假装 activity */
    #mini-term-orca-mockup .mt-worktree-row.is-disconnected { opacity: 0.58; }
    #mini-term-orca-mockup .mt-worktree-row.is-disconnected:hover { opacity: 0.82; }

    #mini-term-orca-mockup .mt-status-lane {
      position: relative;
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      color: light-dark(#77797c, #808286);
    }

    #mini-term-orca-mockup .mt-state-spinner {
      width: 11px;
      height: 11px;
      border: 1.5px solid light-dark(#b4b6b8, #55585c);
      border-top-color: light-dark(#4f8588, #79aeb0);
      border-radius: 50%;
      animation: mt-orca-spin 1s linear infinite;
    }

    @keyframes mt-orca-spin { to { transform: rotate(360deg); } }

    #mini-term-orca-mockup .mt-state-question,
    #mini-term-orca-mockup .mt-state-done,
    #mini-term-orca-mockup .mt-state-error {
      width: 11px;
      height: 11px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 8px;
      line-height: 1;
      font-weight: 800;
    }

    #mini-term-orca-mockup .mt-state-question { background: light-dark(#d6a64a, #d6a64a); color: #19140c; }
    #mini-term-orca-mockup .mt-state-done { background: light-dark(#4aa176, #59b887); color: #07150f; }
    #mini-term-orca-mockup .mt-state-error { background: light-dark(#cc6262, #d36d6d); }
    #mini-term-orca-mockup .mt-state-idle {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: light-dark(#a2a4a7, #65686c);
    }

    #mini-term-orca-mockup .mt-state-disconnected { color: light-dark(#8f9194, #6d7074); }
    #mini-term-orca-mockup .mt-state-disconnected svg { width: 12px; height: 12px; }

    /* unread 叠在状态列同一位置，不挤动标题 */
    #mini-term-orca-mockup .mt-unread-dot {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: light-dark(#4a7fa1, #6aa9cc);
      box-shadow: 0 0 0 2px light-dark(#eeeeed, #18191a);
    }

    #mini-term-orca-mockup .mt-worktree-copy { min-width: 0; }

    #mini-term-orca-mockup .mt-worktree-name {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      color: light-dark(#27282b, #e7e7e2);
      font-size: 12px;
      line-height: 17px;
      font-weight: 610;
    }

    #mini-term-orca-mockup .mt-worktree-name span:first-child {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    #mini-term-orca-mockup .mt-worktree-row[data-unread="true"] .mt-worktree-name span:first-child { font-weight: 720; }

    #mini-term-orca-mockup .mt-primary-label,
    #mini-term-orca-mockup .mt-remote-label {
      flex: 0 0 auto;
      padding: 0 4px;
      border: 1px solid light-dark(#cacbcd, #3a3c40);
      border-radius: 4px;
      color: light-dark(#717377, #8c8e92);
      font-size: 8px;
      font-weight: 600;
      line-height: 13px;
      text-transform: uppercase;
    }

    #mini-term-orca-mockup .mt-worktree-meta {
      overflow: hidden;
      color: light-dark(#838589, #777a7e);
      font-size: 10px;
      line-height: 15px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    #mini-term-orca-mockup .mt-agent-line {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      margin-top: 3px;
      color: light-dark(#585a5e, #a5a7aa);
      font-size: 10px;
      line-height: 15px;
    }

    #mini-term-orca-mockup .mt-provider-mark {
      flex: 0 0 auto;
      width: 14px;
      height: 14px;
      display: grid;
      place-items: center;
      border-radius: 3px;
      background: light-dark(#d8d9d9, #333538);
      color: light-dark(#45474a, #d1d2cf);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 8px;
      font-weight: 750;
    }

    #mini-term-orca-mockup .mt-agent-copy {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    #mini-term-orca-mockup .mt-agent-age { flex: 0 0 auto; color: light-dark(#96989c, #6f7276); font-size: 9px; }

    #mini-term-orca-mockup .mt-row-actions {
      align-self: start;
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 4px;
      opacity: 0;
      background: transparent;
      color: light-dark(#6b6d71, #8d8f93);
      cursor: pointer;
    }

    #mini-term-orca-mockup .mt-worktree-row:hover .mt-row-actions,
    #mini-term-orca-mockup .mt-worktree-row[aria-selected="true"] .mt-row-actions { opacity: 1; }

    /* 断线卡的 Reconnect 常显（覆盖态需要可达动作） */
    #mini-term-orca-mockup .mt-worktree-row.is-disconnected .mt-row-actions[data-reconnect] { opacity: 1; }
    #mini-term-orca-mockup span.mt-row-actions { cursor: pointer; }

    #mini-term-orca-mockup .mt-row-actions svg { width: 13px; height: 13px; }

    /* pending worktree 行 */
    #mini-term-orca-mockup .mt-worktree-row.is-pending { border-style: dashed; border-color: light-dark(#c7c9cb, #383a3e); }
    #mini-term-orca-mockup .mt-worktree-row.is-pending .mt-worktree-name { color: light-dark(#6e7074, #9a9c9f); }

    #mini-term-orca-mockup .mt-sidebar-foot {
      height: 42px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 7px;
      border-top: 1px solid light-dark(#d8d9db, #292b2e);
    }

    #mini-term-orca-mockup .mt-usage-entry {
      min-width: 0;
      height: 30px;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 7px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: light-dark(#66686c, #8f9195);
      font-size: 10px;
      cursor: pointer;
    }

    #mini-term-orca-mockup .mt-usage-entry:hover {
      color: light-dark(#202124, #eeeeea);
      background: light-dark(#e1e2e2, #26282a);
    }

    #mini-term-orca-mockup .mt-usage-value {
      margin-left: auto;
      color: light-dark(#77797d, #7f8286);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 9px;
    }

    /* ---------- workbench ---------- */

    #mini-term-orca-mockup .mt-workbench {
      min-width: 0;
      display: grid;
      grid-template-rows: 37px minmax(0, 1fr) 28px;
      background: light-dark(#fafaf9, #121314);
    }

    #mini-term-orca-mockup .mt-tabbar {
      min-width: 0;
      display: flex;
      align-items: stretch;
      border-bottom: 1px solid light-dark(#d9dade, #292b2e);
      background: light-dark(#f2f2f1, #18191a);
    }

    #mini-term-orca-mockup .mt-tabs { min-width: 0; flex: 1; display: flex; overflow: hidden; }

    #mini-term-orca-mockup .mt-workbench-tab {
      position: relative;
      min-width: 0;
      max-width: 180px;
      height: 36px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 8px 0 10px;
      border: 0;
      border-right: 1px solid light-dark(#dedfe1, #292b2e);
      background: transparent;
      color: light-dark(#74767a, #8b8d91);
      font-size: 11px;
      cursor: pointer;
    }

    #mini-term-orca-mockup .mt-workbench-tab[aria-selected="true"] {
      color: light-dark(#232428, #ecece8);
      background: light-dark(#fafaf9, #121314);
    }

    #mini-term-orca-mockup .mt-workbench-tab[aria-selected="true"]::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      background: light-dark(#4f8588, #79aeb0);
    }

    #mini-term-orca-mockup .mt-workbench-tab svg { flex: 0 0 auto; width: 13px; height: 13px; }

    #mini-term-orca-mockup .mt-tab-label {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    /* 未保存脏点（git 状态只出现在 Files 树徽章上，二者不混用） */
    #mini-term-orca-mockup .mt-tab-dirty {
      width: 6px;
      height: 6px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: light-dark(#d6a64a, #d6a64a);
    }

    #mini-term-orca-mockup .mt-tab-close {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      display: none;
      place-items: center;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: light-dark(#7a7c80, #84868a);
      cursor: pointer;
    }

    #mini-term-orca-mockup .mt-workbench-tab:hover .mt-tab-close { display: grid; }
    #mini-term-orca-mockup .mt-tab-close:hover { background: light-dark(#dfe0e0, #2b2d30); color: light-dark(#232428, #ecece8); }
    #mini-term-orca-mockup span.mt-tab-close { cursor: pointer; }
    #mini-term-orca-mockup .mt-tab-close svg { width: 11px; height: 11px; }

    #mini-term-orca-mockup .mt-tab-actions {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 1px;
      padding: 0 6px;
    }

    #mini-term-orca-mockup .mt-tab-action { width: 25px; height: 25px; }

    /* ---------- terminal surface / split panes ---------- */

    #mini-term-orca-mockup .mt-terminal-surface {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: light-dark(#fbfbfa, #101112);
    }

    #mini-term-orca-mockup .mt-split {
      height: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 5px minmax(0, 1fr);
    }

    #mini-term-orca-mockup .mt-pane {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      padding: 14px 16px 24px;
      color: light-dark(#303237, #cfd1cd);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 11px;
      line-height: 1.62;
      scrollbar-width: thin;
      border: 1px solid transparent;
      border-radius: 4px;
    }

    #mini-term-orca-mockup .mt-pane.is-active { border-color: light-dark(rgba(79, 133, 136, 0.55), rgba(121, 174, 176, 0.5)); }
    #mini-term-orca-mockup .mt-split .mt-pane:first-child { border-top-right-radius: 0; border-bottom-right-radius: 0; }
    #mini-term-orca-mockup .mt-split .mt-pane:last-child { border-top-left-radius: 0; border-bottom-left-radius: 0; }

    #mini-term-orca-mockup .mt-divider { cursor: col-resize; }
    #mini-term-orca-mockup .mt-divider:hover { background: light-dark(rgba(79, 133, 136, 0.35), rgba(121, 174, 176, 0.3)); }

    #mini-term-orca-mockup .mt-terminal-muted { color: light-dark(#8a8c90, #696c70); }
    #mini-term-orca-mockup .mt-terminal-green { color: light-dark(#307b58, #65b98c); }
    #mini-term-orca-mockup .mt-terminal-amber { color: light-dark(#966b16, #d6a64a); }
    #mini-term-orca-mockup .mt-terminal-accent { color: light-dark(#3f777a, #7fb3b5); }
    #mini-term-orca-mockup .mt-terminal-red { color: light-dark(#b05050, #d36d6d); }

    #mini-term-orca-mockup .mt-terminal-cursor {
      display: inline-block;
      width: 6px;
      height: 13px;
      margin-left: 2px;
      vertical-align: -2px;
      background: light-dark(#36383c, #d7d8d4);
      animation: mt-orca-blink 1.15s steps(1) infinite;
    }

    @keyframes mt-orca-blink { 50% { opacity: 0; } }

    #mini-term-orca-mockup .mt-agent-prompt {
      margin: 12px 0;
      padding: 9px 10px;
      border-left: 2px solid light-dark(#4f8588, #79aeb0);
      background: light-dark(#f1f4f3, #181d1d);
      color: light-dark(#3b3d41, #c9cbc7);
    }

    /* ---------- 合并后的 workbench 底条（原 context 条 + 状态栏） ---------- */

    #mini-term-orca-mockup .mt-workbar {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
      border-top: 1px solid light-dark(#dedfe1, #242629);
      background: light-dark(#f2f2f1, #171819);
      color: light-dark(#74767a, #777a7e);
      font-size: 10px;
      white-space: nowrap;
      overflow: hidden;
    }

    #mini-term-orca-mockup .mt-workbar-group {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    #mini-term-orca-mockup .mt-workbar svg { width: 12px; height: 12px; flex: 0 0 auto; }
    #mini-term-orca-mockup .mt-workbar-label { overflow: hidden; text-overflow: ellipsis; }
    #mini-term-orca-mockup .mt-workbar-sep { color: light-dark(#b5b6b9, #44474a); }
    #mini-term-orca-mockup .mt-workbar-spacer { flex: 1; }

    #mini-term-orca-mockup .mt-workbar .mt-state-question,
    #mini-term-orca-mockup .mt-workbar .mt-state-done,
    #mini-term-orca-mockup .mt-workbar .mt-state-idle { flex: 0 0 auto; }

    /* ---------- pending 创建面板 ---------- */

    #mini-term-orca-mockup .mt-stage-panel {
      height: 100%;
      overflow: auto;
      padding: 22px 24px;
    }

    #mini-term-orca-mockup .mt-stage-title { font-size: 13px; font-weight: 650; color: light-dark(#2b2c2f, #e2e2de); }
    #mini-term-orca-mockup .mt-stage-sub { margin-top: 3px; font-size: 10px; color: light-dark(#838589, #777a7e); }

            <div class="mt-tree-row indent-1"><i data-lucide="chevron-down"></i><i data-lucide="folder-open"></i><span class="mt-tree-name">src</span></div>
            <div class="mt-tree-row indent-2 is-active" data-open-file="ssh_relay.rs"><i data-lucide="file-code-2"></i><span class="mt-tree-name">ssh_relay.rs</span><span class="mt-tree-change">M</span></div>
            <div class="mt-tree-row indent-2"><i data-lucide="file-code-2"></i><span class="mt-tree-name">agent_status.rs</span><span class="mt-tree-change">M</span></div>`,
          git: `<div class="mt-context-section-label">Last synchronized changes / 2</div>
            <div class="mt-git-file" data-open-diff="ssh_relay.rs"><span class="mt-git-code">M</span><span>ssh_relay.rs</span><span>+72</span></div>
            <div class="mt-git-file" data-open-diff="agent_status.rs"><span class="mt-git-code">M</span><span>agent_status.rs</span><span>+51</span></div>
            <div class="mt-context-section-label">Remote commits</div>
            <div class="mt-commit-row"><div class="mt-commit-head"><i data-lucide="git-commit-horizontal"></i><span>Add relay replay watermark</span><span class="mt-commit-sha">a82cc7d</span></div><div class="mt-commit-copy">buildbox / 3 hours ago</div></div>`,
          sessions: `<div class="mt-context-section-label">Last scan in /srv/edge-runtime</div>
            <div class="mt-session-row"><div class="mt-session-head"><span class="mt-session-provider">G</span><span>Grok / relay protocol</span><span class="mt-session-time">stale</span></div><div class="mt-session-copy">Remote disconnected / last seen 3m</div></div>`
        }
      };

      const projectTasks = {
        'mini-term': `<div class="mt-context-section-label">github.com/leo/mini-term</div>
          <div class="mt-task-row"><div class="mt-task-head"><span class="mt-task-kind">I</span><span>Persist worktree-specific open files</span><span class="mt-task-number">#184</span></div><div class="mt-task-copy">Issue / open / ui</div></div>
          <div class="mt-task-row"><div class="mt-task-head"><span class="mt-task-kind">P</span><span>Project-first sidebar shell</span><span class="mt-task-number">#182</span></div><div class="mt-task-copy">Pull request / review requested</div></div>
          <div class="mt-task-row"><div class="mt-task-head"><span class="mt-task-kind">I</span><span>Remote Agent session indexing</span><span class="mt-task-number">#177</span></div><div class="mt-task-copy">Issue / in progress / agent-runtime</div></div>`,
        'edge-runtime': `<div class="mt-context-section-label">github.com/leo/edge-runtime</div>
          <div class="mt-task-row"><div class="mt-task-head"><span class="mt-task-kind">I</span><span>Replay status after SSH reconnect</span><span class="mt-task-number">#91</span></div><div class="mt-task-copy">Issue / open / relay</div></div>
          <div class="mt-task-row"><div class="mt-task-head"><span class="mt-task-kind">P</span><span>Fence stale connection epochs</span><span class="mt-task-number">#88</span></div><div class="mt-task-copy">Pull request / checks running</div></div>`
      };

      // 独立空态：Tasks 无 GitHub remote / Git 非仓库 / Sessions 无扫描结果
      const taskEmptyState = `<div class="mt-empty-state"><i data-lucide="circle-dot"></i><div><strong>No GitHub remote configured</strong></div><div>Files / Git / Sessions 不受影响，仅本 tab 显示空态。</div></div>`;
      const gitEmptyState = `<div class="mt-empty-state"><i data-lucide="git-branch"></i><div><strong>Not a git repository</strong></div><div>~/notes 不是 Git 仓库，Git tab 仅显示空态。</div></div>`;
      const sessionsEmptyState = `<div class="mt-empty-state"><i data-lucide="messages-square"></i><div><strong>No agent sessions</strong></div><div>No supported agent session files found in ~/notes.</div></div>`;

      function renderContext() {
        const worktree = activeRow.dataset.worktree;
        const project = activeRow.dataset.repo;
        contextTitle.textContent = contextLabel(activeContextView);
        if (activeContextView === 'tasks') {
          contextBody.innerHTML = projectTasks[project] || taskEmptyState;
        } else if (worktree === 'relay-hardening') {
          contextBody.innerHTML = '<div class="mt-empty-state"><i data-lucide="loader-circle"></i><div>Worktree is being created…</div></div>';
        } else {
          contextBody.innerHTML = (worktreeUi[worktree] || worktreeUi.main)[activeContextView];
        }
        refreshIcons();
        contextBody.querySelectorAll('[data-open-file]').forEach((rowEl) => {
          rowEl.addEventListener('click', () => {
            const file = rowEl.dataset.openFile;
            const model = tabModel[activeRow.dataset.worktree] || tabModel.main;
            const existing = model.files.find((f) => f.label === file);
            if (!existing) model.files.unshift({ label: file, icon: 'file-code-2', dirty: false, file });
            activeTabKind = 'file';
            activeDiffFile = file;
            renderTabs();
            renderSurface();
          });
        });
        contextBody.querySelectorAll('[data-open-diff]').forEach((rowEl) => {
          rowEl.addEventListener('click', () => {
            activeTabKind = 'diff';
            activeDiffFile = rowEl.dataset.openDiff;
            renderTabs();
            renderSurface();
          });
        });
        contextBody.querySelectorAll('[data-jump-session]').forEach((rowEl) => {
          rowEl.addEventListener('click', () => {
            const target = root.querySelector('.mt-worktree-row[data-worktree="' + rowEl.dataset.jumpSession + '"]');
            if (target) selectRow(target);
          });
        });
      }

      /* ---------- workbar（合并底条） ---------- */

      function renderWorkbar() {
        const state = activeRow.dataset.state;
        wbPath.textContent = activeRow.dataset.path;
        wbBranch.textContent = activeRow.dataset.branch;
        const agent = activeRow.dataset.agent;
        wbAgent.innerHTML = stateGlyph(state) + '<span class="mt-workbar-label">' + (agent ? agent + ' · ' : '') + stateText(state) + '</span>';
        wbAttach.textContent = state === 'disconnected' ? 'Detached' : state === 'reconnecting' ? 'Reconnecting…' : 'Attached';
        refreshIcons();
      }

      /* ---------- row selection ---------- */

      function selectRow(row) {
        root.querySelectorAll('.mt-worktree-row').forEach((candidate) => {
          candidate.setAttribute('aria-selected', candidate === row ? 'true' : 'false');
        });
        activeRow = row;
        activeTabKind = 'terminal';
        titleWorktree.textContent = row.dataset.worktree;
        renderTabs();
        renderSurface();
        renderWorkbar();
        renderContext();
        searchPanel.classList.remove('is-visible');
      }

      let activeDiffFile = 'project_list.rs';

      root.querySelectorAll('.mt-worktree-row').forEach((row) => {
        row.addEventListener('click', (e) => {
          if (e.target.closest('[data-reconnect]')) return;
          selectRow(row);
        });
      });

      root.querySelectorAll('[data-reconnect]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const row = btn.closest('.mt-worktree-row');
          row.classList.remove('is-disconnected');
          row.dataset.state = 'reconnecting';
          row.querySelector('.mt-status-lane').innerHTML = '<span class="mt-state-spinner"></span>';
          row.querySelector('.mt-worktree-meta').textContent = row.dataset.branch + ' / reconnecting…';
          btn.innerHTML = '<i data-lucide="loader-circle"></i>';
          refreshIcons();
          if (activeRow === row) { renderTabs(); renderWorkbar(); }
        });
      });

      root.querySelectorAll('[data-context-view]').forEach((button) => {
        button.addEventListener('click', () => {
          activeContextView = button.dataset.contextView;
          root.querySelectorAll('[data-context-view]').forEach((candidate) => candidate.setAttribute('aria-selected', candidate === button ? 'true' : 'false'));
          renderContext();
        });
      });

      root.querySelectorAll('[data-open-search]').forEach((button) => {
        button.addEventListener('click', () => searchPanel.classList.toggle('is-visible'));
      });

      root.querySelectorAll('[data-search-jump]').forEach((result) => {
        result.addEventListener('click', () => {
          const jump = result.dataset.searchJump;
          if (jump === 'file') {
            const mainRow = root.querySelector('.mt-worktree-row[data-worktree="main"]');
            selectRow(mainRow);
            activeTabKind = 'file';
            renderTabs();
            renderSurface();
            return;
          }
          const target = root.querySelector('.mt-worktree-row[data-worktree="' + jump + '"]');
          if (target) selectRow(target);
        });
      });

      renderTabs();
      renderSurface();
      renderWorkbar();
      renderContext();
      refreshIcons();
    })();
  </script>
</div>
</body>
</html>
