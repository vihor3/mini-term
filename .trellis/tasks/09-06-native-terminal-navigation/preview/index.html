<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Mini-Term · 布局预览</title>
<style>
  :root {
    --left: 300px; --right: 284px; --header: 42px; --title-tools-min: 160px;
    --base: #101113; --surface: #18191c; --raised: #232529;
    --line: #2a2c30; --text: #d9dadd; --muted: #90949c;
    --blue: #75a9f5; --green: #8ac79a; --cyan: #8abbb8;
    font: 14px/1.5 "Segoe UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    color: var(--text); background: var(--base); color-scheme: dark;
  }
  * { box-sizing: border-box; letter-spacing: 0; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  button, input { font: inherit; color: inherit; }
  button { border: 0; background: none; cursor: pointer; padding: 0; }
  button:focus-visible, summary:focus-visible, .terminal:focus-visible {
    outline: 1px solid var(--blue); outline-offset: -3px;
  }
  button[aria-disabled="true"] { color: #72767e; cursor: default; }
  [hidden] { display: none !important; }
  .icon { display: block; width: 16px; height: 16px; flex: 0 0 16px; }
  .icon-button { width: 32px; height: 32px; display: grid; place-items: center; flex: none; border-radius: 4px; color: var(--muted); }
  .icon-button:hover:not([aria-disabled="true"]) { background: var(--raised); color: var(--text); }
  .truncate { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; }
  .muted { color: var(--muted); }
  .green { color: var(--green); }
  .app { display: grid; grid-template: var(--header) minmax(0, 1fr) / var(--left) minmax(0, 1fr) var(--right); height: 100vh; height: 100dvh; }
  .titlebar { grid-column: 1 / -1; display: grid; grid-template-columns: var(--left) minmax(0, 1fr) max(var(--right), var(--title-tools-min)); background: var(--surface); border-bottom: 1px solid var(--line); z-index: 20; }
  .brand { display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px; min-width: 0; border-right: 1px solid var(--line); }
  .brand img { width: 26px; height: 26px; flex: none; }
  .brand-name { font-size: 14px; font-weight: 600; flex: 1; }
  .title-main { display: flex; align-items: center; min-width: 0; overflow: clip; }
  .title-tools { display: flex; align-items: center; justify-content: flex-end; min-width: 0; border-left: 1px solid var(--line); }
  .tabs { display: flex; flex: 0 1 auto; min-width: 0; height: 100%; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { display: flex; width: 200px; flex: 0 0 200px; position: relative; border-right: 1px solid var(--line); color: var(--muted); }
  .tab.active { color: var(--text); background: var(--base); }
  .tab.active::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--blue); }
  .tab-select { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; padding: 0 0 0 14px; font-size: 14px; text-align: left; }
  .tab-select .icon { width: 15px; height: 15px; }
  .tab-close { align-self: center; margin: 0 4px; opacity: 0; }
  .tab:hover .tab-close, .tab:focus-within .tab-close, .tab.active .tab-close { opacity: 1; }
  .tab:hover:not(.active) { background: #1f2024; }
  .new-tab { margin: 0 4px; }
  .drag-space { flex: 1; min-width: 24px; height: 100%; }
  .window-buttons { display: flex; flex: none; align-self: stretch; margin-left: 6px; }
  .window-buttons button { width: 40px; display: grid; place-items: center; }
  .window-buttons .icon { width: 14px; height: 14px; }
  .sidebar { grid-column: 1; grid-row: 2; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .side-nav { padding: 10px 10px 12px; border-bottom: 1px solid var(--line); }
  .nav-row { display: flex; align-items: center; gap: 12px; width: 100%; height: 36px; padding: 0 10px; text-align: left; }
  .section-label { display: flex; align-items: center; height: 40px; padding: 0 16px; color: var(--muted); font-size: 12px; }
  .projects { flex: 1; min-height: 0; overflow: auto; padding: 0 8px 16px; }
  .project { margin-bottom: 15px; }
  .project-heading { display: flex; align-items: center; gap: 8px; height: 36px; border-radius: 4px; padding-left: 6px; }
  .project-heading > .icon { color: var(--cyan); }
  .project-name { font-weight: 600; flex: 1; }
  .project-menu { opacity: 0; }
  .project-heading:hover .project-menu, .project-heading:focus-within .project-menu, .project-menu[aria-expanded="true"] { opacity: 1; }
  .worktrees { padding-left: 20px; }
  .worktree { width: 100%; display: flex; align-items: flex-start; gap: 9px; min-height: 54px; padding: 8px 9px; border-radius: 4px; text-align: left; border-left: 2px solid transparent; }
  .worktree > .icon { margin-top: 3px; color: var(--muted); }
  .worktree:hover { background: #222428; }
  .worktree.selected { background: #252b34; border-left-color: var(--blue); }
  .worktree.selected > .icon { color: var(--blue); }
  .worktree-copy { min-width: 0; flex: 1; }
  .worktree-copy span { display: block; }
  .worktree-path { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex: none; margin-top: 8px; }
  .side-footer { display: flex; gap: 8px; padding: 9px 12px; border-top: 1px solid var(--line); }
  .terminal { grid-column: 2; grid-row: 2; overflow: auto; padding: 20px 16px; min-width: 0; background: var(--base); font: 14px/1.65 "Cascadia Mono", "DejaVu Sans Mono", Consolas, monospace; }
  .shell-line { overflow-wrap: anywhere; white-space: pre-wrap; }
  .shell-user { color: #91dba0; font-weight: 600; }
  .shell-path { color: #84b6f3; font-weight: 600; }
  .cursor { display: inline-block; width: 8px; height: 18px; background: var(--blue); vertical-align: -3px; margin-left: 7px; }
  .transcript { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; margin: 0 0 20px; }
  .empty { display: flex; height: 100%; align-items: center; justify-content: center; }
  .command { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 4px; }
  .command:hover { background: var(--raised); }
  .context { grid-column: 3; grid-row: 2; background: #161719; border-left: 1px solid var(--line); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .context-tabs { display: flex; flex: none; height: 40px; border-bottom: 1px solid var(--line); padding: 0 5px; }
  .context-tab { display: flex; align-items: center; justify-content: center; gap: 5px; flex: 1; min-width: 0; font-size: 12px; color: var(--muted); border-bottom: 2px solid transparent; }
  .context-tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--blue); }
  .context-tab:hover { background: #202226; }
  .context-tab .icon { width: 14px; height: 14px; flex-basis: 14px; }
  .context-toolbar { display: flex; align-items: center; min-height: 42px; padding-right: 8px; flex: none; }
  .context-root { padding: 10px 14px; font-size: 12px; flex: 1; }
  .context-body { overflow: auto; flex: 1; min-height: 0; padding: 0 8px 20px; scrollbar-width: thin; scrollbar-color: #3b3d43 transparent; }
  .file-row, summary { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 8px; color: #b9bdc4; }
  .file-row > span:last-child, summary > span:last-child { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .file-row .icon { color: #8b969f; width: 14px; height: 14px; flex-basis: 14px; }
  details { margin-left: 0; }
  details > .children { padding-left: 17px; }
  summary { list-style: none; cursor: pointer; }
  summary::-webkit-details-marker { display: none; }
  summary:hover, .file-row:hover { background: #202226; }
  summary .folder { color: var(--cyan); }
  summary .chevron { width: 12px; height: 12px; flex-basis: 12px; color: var(--muted); }
  details[open] > summary .chevron { transform: rotate(90deg); }
  .panel-heading { color: var(--muted); font-size: 12px; padding: 12px 8px 6px; }
  .data-row { display: flex; align-items: flex-start; gap: 9px; padding: 10px 8px; border-bottom: 1px solid #24262a; width: 100%; text-align: left; }
  .data-row .icon { margin-top: 3px; color: var(--muted); }
  .data-copy { min-width: 0; flex: 1; }
  .data-copy small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
  .menu { position: fixed; z-index: 60; width: 192px; padding: 5px; background: #232529; border: 1px solid #3a3d43; border-radius: 6px; box-shadow: 0 8px 24px #0006; }
  .menu button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 34px; padding: 0 9px; border-radius: 3px; text-align: left; font-size: 13px; }
  .menu button:hover:not([aria-disabled="true"]) { background: #34373d; }
  .menu hr { border: 0; border-top: 1px solid #393b40; margin: 5px 3px; }
  .tooltip { position: fixed; z-index: 100; pointer-events: none; padding: 6px 9px; background: #303238; color: #eeeeef; border: 1px solid #45484f; border-radius: 4px; font-size: 12px; max-width: calc(100vw - 16px); white-space: pre-line; overflow-wrap: anywhere; box-shadow: 0 3px 12px #0005; }
  .scrim { position: fixed; inset: var(--header) 0 0; background: #0005; z-index: 25; }
  .app.collapsed { --left: 48px; }
  .collapsed .brand { padding: 0 8px; }
  .collapsed .brand img, .collapsed .brand-name, .collapsed .side-nav, .collapsed .section-label, .collapsed .projects { display: none; }
  .collapsed .side-footer { flex-direction: column; padding: 8px; margin-top: auto; }
  .app.context-hidden { --right: 0px; }
  .context-hidden .context { display: none; }
  @media (max-width: 1080px) {
    .app { --right: 0px; }
    .context { display: none; }
    .app.context-open .context { display: flex; position: fixed; top: var(--header); bottom: 0; right: 0; width: min(310px, calc(100vw - 48px)); z-index: 30; box-shadow: -12px 0 28px #0004; }
  }
  @media (max-width: 760px) {
    .app { --left: 48px; --title-tools-min: 136px; }
    .brand { padding: 0 8px; }
    .brand img, .brand-name, .side-nav, .section-label, .projects { display: none; }
    .side-footer { flex-direction: column; padding: 8px; margin-top: auto; }
    .app.drawer .sidebar { position: fixed; left: 0; top: var(--header); bottom: 0; width: min(300px, calc(100vw - 40px)); z-index: 30; box-shadow: 12px 0 28px #0004; }
    .app.drawer .side-nav, .app.drawer .section-label, .app.drawer .projects { display: block; }
    .app.drawer .side-footer { flex-direction: row; padding: 9px 12px; }
    .app.drawer .section-label { display: flex; }
    .window-buttons { margin: 0; }
    .window-buttons button { width: 32px; }
    .drag-space { min-width: 8px; }
    .tab-close, .project-menu { opacity: 1; }
    .terminal { padding: 16px 12px; }
  }
</style>
</head>

  const file = name => '<div class="file-row">' + icon('file') + '<span>' + esc(name) + '</span></div>';
  function folder(name, children, open = false) {
    const expanded = active().folders[name] ?? open;
    return '<details data-folder="' + name + '"' + (expanded ? ' open' : '') + '><summary>' + icon('chevron', 'chevron') + icon('folder', 'folder') +
      '<span>' + name + '</span></summary><div class="children">' + children + '</div></details>';
  }
  function renderContext() {
    $('context-tabs').innerHTML = tools.map(([id, label, glyph]) => '<button class="context-tab" id="tool-' + id + '" role="tab" aria-controls="context-body" aria-selected="' +
      (id === selectedTool) + '" data-tool="' + id + '">' + icon(glyph) + label + '</button>').join('');
    $('context-root').textContent = active().path.replace('/home/leo', '~');
    $('context-body').setAttribute('aria-labelledby', 'tool-' + selectedTool);
    const row = (title, detail, glyph = 'file') => '<div class="data-row">' + icon(glyph) + '<span class="data-copy">' + esc(title) + '<small>' + esc(detail) + '</small></span></div>';
    let content;
    if (selectedTool === 'files') content = current === 'notes-main' ? folder('notes', ['ideas.md', 'daily.md', 'reading.md'].map(file).join(''), true) + file('README.md') :
      folder('.github', folder('workflows', file('ci.yml') + file('release.yml'))) + folder('.trellis', folder('tasks', file('prd.md'))) +
      folder('crates', ['mt-app', 'mt-ui', 'mt-config', 'mt-terminal', 'mt-pty', 'mt-ssh', 'mt-project', 'mt-layout'].map(name =>
      folder(name, folder('src', file('lib.rs')) + file('Cargo.toml'))).join(''), true) + folder('docs', file('README.md') + file('icon.png')) +
      folder('mobile', folder('src', file('App.tsx')) + file('package.json')) + ['.gitignore', 'AGENTS.md', 'Cargo.lock', 'Cargo.toml', 'LICENSE', 'README.md'].map(file).join('');
    if (selectedTool === 'git') content = row(active().name, '当前分支', 'branch') + '<div class="panel-heading">工作区</div>' +
      (current === 'notes-main' ? row('daily.md', '已修改') : row('title_bar.rs', 'crates/mt-app/src · 已修改') + row('prd.md', '.trellis/tasks · 已修改'));
    if (selectedTool === 'tasks') content = '<div class="panel-heading">待办</div>' +
      (current === 'notes-main' ? row('整理阅读笔记', 'notes', 'tasks') : row('终端导航布局', '界面 · 进行中', 'tasks') + row('工作树切换', '交互 · 待办', 'tasks'));
    if (selectedTool === 'sessions') content = '<div class="panel-heading">当前工作树</div>' + active().tabs.map(tab => '<button class="data-row" data-tab="' + tab.id + '">' +
      icon('terminal') + '<span class="data-copy">' + esc(tab.name) + '<small>' + esc(active().name) + '</small></span></button>').join('');
    $('context-body').innerHTML = content;
    $('context-body').scrollTop = active().scroll[selectedTool] || 0;
    $('context-body').querySelectorAll('details').forEach(el => el.addEventListener('toggle', () => { active().folders[el.dataset.folder] = el.open; }));
  }
  function rememberScroll() { active().scroll[selectedTool] = $('context-body').scrollTop; }
  function render() { renderProjects(); renderTabs(); renderContext(); }
  function focusTab() { ($('tab-' + active().selected) || $('new-tab')).focus(); }
  function addTab() { const tab = {id: 't' + nextTab++, name: 'Bash'}; active().tabs.push(tab); active().selected = tab.id; renderTabs(); renderContext(); focusTab(); }
  function closeMenu(restore = false) { $('menu').hidden = true; menuAnchor?.setAttribute('aria-expanded', 'false'); if (restore) menuAnchor?.focus(); menuAnchor = null; }
  function openMenu(anchor) {
    const same = menuAnchor === anchor; closeMenu(); if (same) return;
    menuAnchor = anchor; menuGroup = groups.find(group => group.id === anchor.dataset.projectMenu); anchor.setAttribute('aria-expanded', 'true');
    $('menu').innerHTML = '<button role="menuitem" data-menu-new>' + icon('plus') + '新建终端</button><button role="menuitem" data-menu-fold>' + icon('panel-left') +
      (menuGroup.collapsed ? '展开工作树' : '收起工作树') + '</button><hr><button role="menuitem" aria-disabled="true">' + icon('settings') + '项目设置</button>';
    $('menu').hidden = false; const rect = anchor.getBoundingClientRect();
    $('menu').style.left = Math.max(8, Math.min(innerWidth - 200, rect.right - 192)) + 'px';
    $('menu').style.top = Math.max(8, Math.min(innerHeight - $('menu').offsetHeight - 8, rect.bottom + 4)) + 'px';
    $('menu').querySelector('button').focus();
  }
  function syncPanels() {
    const small = innerWidth <= 760, overlay = innerWidth <= 1080;
    const sidebarOpen = small ? $('app').classList.contains('drawer') : !$('app').classList.contains('collapsed');
    const contextOpen = overlay ? $('app').classList.contains('context-open') : !$('app').classList.contains('context-hidden');
    $('sidebar-toggle').setAttribute('aria-expanded', sidebarOpen);
    $('sidebar-toggle').dataset.tip = sidebarOpen ? '收起项目侧栏' : '展开项目侧栏';
    $('sidebar-toggle').setAttribute('aria-label', $('sidebar-toggle').dataset.tip);
    $('context-toggle').setAttribute('aria-expanded', contextOpen);
    $('scrim').hidden = !(small && sidebarOpen || overlay && contextOpen);
  }
  document.addEventListener('click', event => {
    resetTip(); const button = event.target.closest('button');
    if (menuAnchor && !event.target.closest('#menu, [data-project-menu]')) closeMenu();
    if (!button || button.getAttribute('aria-disabled') === 'true') return;
    const d = button.dataset;
    if (d.projectMenu) return openMenu(button);
    if ('menuNew' in d) { rememberScroll(); current = menuGroup.trees[0]; closeMenu(); renderProjects(); addTab(); }
    else if ('menuFold' in d) { menuGroup.collapsed = !menuGroup.collapsed; const groupId = menuGroup.id; closeMenu(); renderProjects(); document.querySelector('[data-project-menu="' + groupId + '"]').focus(); }
    else if (d.worktree) { rememberScroll(); current = d.worktree; $('app').classList.remove('drawer'); syncPanels(); render(); }
    else if (d.tab) { active().selected = d.tab; renderTabs(); focusTab(); }
    else if (d.close) {
      const tabs = active().tabs, index = tabs.findIndex(tab => tab.id === d.close);
      if (index < 0) return; tabs.splice(index, 1);
      if (active().selected === d.close) active().selected = (tabs[index] || tabs[index - 1])?.id || null;
      renderTabs(); renderContext(); focusTab();
    }
    else if (d.tool) { rememberScroll(); selectedTool = d.tool; renderContext(); $('tool-' + selectedTool).focus(); }
    else if (button.id === 'context-refresh') { rememberScroll(); renderContext(); }
    else if (button.id === 'new-tab' || 'new' in d) addTab();
    else if (button.id === 'sidebar-toggle') { $('app').classList.toggle(innerWidth <= 760 ? 'drawer' : 'collapsed'); $('app').classList.remove('context-open'); syncPanels(); }
    else if (button.id === 'context-toggle') { $('app').classList.toggle(innerWidth <= 1080 ? 'context-open' : 'context-hidden'); $('app').classList.remove('drawer'); syncPanels(); }
  });
  $('scrim').addEventListener('click', () => { $('app').classList.remove('drawer', 'context-open'); closeMenu(); syncPanels(); });
  document.addEventListener('keydown', event => {
    resetTip();
    if (event.key === 'Escape') { resetTip(); closeMenu(true); $('app').classList.remove('drawer', 'context-open'); syncPanels(); }
    const parent = event.target.closest('[role="tablist"], #menu');
    if (!parent || !['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(event.key)) return;
    const buttons = [...parent.querySelectorAll('[role="tab"], [role="menuitem"]:not([aria-disabled="true"])')];
    if (!buttons.length) return; event.preventDefault(); const index = buttons.indexOf(document.activeElement);
    const next = event.key === 'Home' ? 0 : event.key === 'End' ? buttons.length - 1 : (index + (['ArrowLeft', 'ArrowUp'].includes(event.key) ? -1 : 1) + buttons.length) % buttons.length;
    buttons[next].focus();
  });
  let tipTimer, tipAnchor = null, warmGroup = null;
  function hideTip() { clearTimeout(tipTimer); tipAnchor?.removeAttribute('aria-describedby'); tipAnchor = null; $('tooltip').hidden = true; }
  function resetTip() { hideTip(); warmGroup = null; }
  function enterTip(anchor) {
    if (!anchor || anchor === tipAnchor) return;
    hideTip(); tipAnchor = anchor;
    const group = anchor.closest('[data-tip-group]') || anchor;
    tipTimer = setTimeout(() => {
      if (tipAnchor !== anchor || !anchor.isConnected) return;
      warmGroup = group; $('tooltip').textContent = anchor.dataset.tip; $('tooltip').hidden = false; anchor.setAttribute('aria-describedby', 'tooltip');
      const r = anchor.getBoundingClientRect(), tip = $('tooltip');
      tip.style.left = Math.max(8, Math.min(innerWidth - tip.offsetWidth - 8, r.left)) + 'px';
      tip.style.top = Math.max(8, r.bottom + tip.offsetHeight + 12 < innerHeight ? r.bottom + 6 : r.top - tip.offsetHeight - 6) + 'px';
    }, warmGroup === group ? 0 : 500);
  }
  document.addEventListener('pointerover', e => enterTip(e.target.closest('[data-tip]')));
  document.addEventListener('pointerout', e => {
    const next = e.relatedTarget instanceof Node ? e.relatedTarget : null;
    const anchor = e.target.closest('[data-tip]');
    if (anchor && (!next || !anchor.contains(next))) hideTip();
    if (warmGroup && (!next || !warmGroup.contains(next))) resetTip();
  });
  document.addEventListener('focusin', e => enterTip(e.target.closest('[data-tip]')));
  document.addEventListener('focusout', resetTip);
  document.addEventListener('scroll', () => { resetTip(); closeMenu(); }, true);
  window.addEventListener('blur', () => { resetTip(); closeMenu(); });
  window.addEventListener('resize', () => { resetTip(); closeMenu(); syncPanels(); });
  render(); syncPanels();
</script>
</body>
</html>
