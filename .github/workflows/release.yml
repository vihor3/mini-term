name: Build & Release

# 发布形态(GPUI 原生版,三平台矩阵参考旧 Tauri 流水线):
# - Windows x64:NSIS 安装包(scripts/windows-installer.nsi,makensis 三级兜底取得
#   —— 镜像自带 / choco / 官方便携包直下,见 scripts/build-windows-installer.ps1;
#   身份对齐旧 Tauri NSIS —— HKCU Uninstall\Mini-Term 键 + 读旧 InstallLocation,
#   老用户原地升级:装过就先弹框告知、再跑旧版卸载器,不是文件覆盖写;
#   包内平铺 exe + 三个 sidecar + mt-terminal-host + portable-conpty/,
#   运行时全部按「与 exe 同目录」定位)
# - macOS arm64:.app bundle 打成 dmg(无签名,首次打开需 `xattr -cr` 放行,
#   bundle id 沿用旧 Tauri 版的 com.mini-term.app)
# - Linux x64:deb + tar.gz(deb 版本号把 `-` 换成 `~`,预发布序才正确 ——
#   1.0.0~beta < 1.0.0;rpm 不做了,旧流水线里它本来就进不了预发布版本号)
# - sidecar 由 stage-sidecars.mjs 就位到 target/release/,组装步骤直接从
#   该目录收集 —— 目录布局即最终包布局
# - release 壳由 create-release 先建好(prerelease 按 tag 含 `-` 自动标),
#   三平台只向其上传产物,避免并行抢建 release
# - 资产名沿用旧正式版(Tauri v2 bundler)的形态:`Mini-Term_<版本>_<arch>…`,
#   **不带 v 前缀、不带 gpui 字样**。渲染层从 WebView 换成 GPUI 是内部实现,
#   用户是按文件名认包的(v1.0.x-beta 那一串 `mini-term-gpui-*` 是迁移期的临时名)
# ⚠️ macOS / Linux 是「代码支持,可用性欠佳」档,构建线未经真机验证;
#   fail-fast: false 保证它们失败不拖累 Windows 产物

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          CURRENT_TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            RANGE="$CURRENT_TAG"
          else
            RANGE="${PREV_TAG}..${CURRENT_TAG}"
          fi
          LOGS=$(git log "$RANGE" --pretty=format:"- %s" --no-merges)
          # write to GITHUB_OUTPUT using delimiter
          {
            echo "body<<CHANGELOG_EOF"
            echo "## 更新内容"
            echo ""
            echo "$LOGS"
            echo ""
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          name: Mini-Term ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          prerelease: ${{ contains(github.ref_name, '-') }}

  build-gpui:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      # gpui Linux 后端(x11/wayland,见 mt-app 的 target 依赖段)的构建依赖:
      # font-kit 要 fontconfig/freetype,xkb/wayland 头文件给 windowing 层。
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake pkg-config \
            libfontconfig1-dev libfreetype6-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcb1-dev libasound2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            sidecars -> target

      - name: Verify locked Cargo graphs
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          cargo metadata --manifest-path sidecars/Cargo.toml --locked --format-version 1 --no-deps > /dev/null

      - name: Resolve Windows package version
        if: matrix.platform == 'windows-latest'
        id: windows-package-version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $metadataJson = cargo metadata --locked --format-version 1 --no-deps
          if ($LASTEXITCODE -ne 0) { throw "cargo metadata exited with $LASTEXITCODE" }
          $metadata = $metadataJson | ConvertFrom-Json
          $app = @($metadata.packages | Where-Object name -eq 'mt-app')
          if ($app.Count -ne 1) { throw "expected one mt-app Cargo package, found $($app.Count)" }
          $version = ([string]$env:RELEASE_TAG).Trim()
          if ($version.StartsWith('v', [StringComparison]::OrdinalIgnoreCase)) {
            $version = $version.Substring(1)
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "app-version=$([string]$app[0].version)" >> $env:GITHUB_OUTPUT

      - name: Build & stage sidecars (+ portable ConPTY on Windows)
        run: node scripts/stage-sidecars.mjs --release --target ${{ matrix.target }}

      - name: Build GPUI app
        run: cargo build --locked --release --package mt-app

      - name: Verify staged Windows payload
        if: matrix.platform == 'windows-latest'
        run: node scripts/stage-sidecars.mjs --verify-only --release --target ${{ matrix.target }}

      - name: Build NSIS installer (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.windows-package-version.outputs.version }}
        run: |
          & ./scripts/build-windows-installer.ps1 -Version $env:PACKAGE_VERSION

      - name: Extract and verify NSIS installer (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.windows-package-version.outputs.version }}
          APP_VERSION: ${{ steps.windows-package-version.outputs.app-version }}
        run: |
          $installer = "dist/Mini-Term_$($env:PACKAGE_VERSION)_x64-setup.exe"
          & ./scripts/verify-windows-installer.ps1 `
            -Version $env:PACKAGE_VERSION `
            -AppVersion $env:APP_VERSION `
            -InstallerPath $installer `
            -OutputPath dist/windows-package-validation.json

      - name: Assemble .app bundle + dmg (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          APP="dist/Mini-Term.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          for name in mini-term miniterm-hook mt-ssh-cli mt-ssh-mcp mt-terminal-host; do
            cp "target/release/$name" "$APP/Contents/MacOS/"
          done
          mkdir -p icon.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" docs/icon.png --out "icon.iconset/icon_${size}x${size}.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/icon.icns"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Mini-Term</string>
            <key>CFBundleDisplayName</key><string>Mini-Term</string>
            <key>CFBundleIdentifier</key><string>com.mini-term.app</string>
            <key>CFBundleExecutable</key><string>mini-term</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          hdiutil create -volname "Mini-Term" -srcfolder "$APP" -ov -format UDZO \
            "dist/Mini-Term_${VERSION}_aarch64.dmg"
          ls -la dist

      - name: Assemble deb + tar.gz (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          # ⚠️ 替换串必须转义:bash 对 ${var//pat/rep} 的 rep 做 tilde 展开,
          # 裸 ~ 会变成 $HOME,版本号成 1.0.0/home/runnerbeta(首个 tag 踩过)
          DEB_VERSION="${VERSION//-/\~}"
          STAGE="dist/mini-term"
          mkdir -p "$STAGE"
          for name in mini-term miniterm-hook mt-ssh-cli mt-ssh-mcp mt-terminal-host; do
            cp "target/release/$name" "$STAGE/"
          done
          # ⚠️ 打包目录仍叫 `mini-term`(解压出来就是可执行文件名),只有**资产名**
          # 用 `Mini-Term_…` —— Linux 大小写敏感,上传的 glob 抓不到这个暂存目录
          tar -C dist -czf "dist/Mini-Term_${VERSION}_amd64.tar.gz" mini-term
          # sidecar 按「与 exe 同目录」定位 → 全家落 /usr/lib/mini-term,
          # /usr/bin 放符号链接(Linux 的 current_exe 走 /proc/self/exe,天然解链接)
          PKG="dist/deb/mini-term_${DEB_VERSION}_amd64"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin" "$PKG/usr/lib/mini-term" \
            "$PKG/usr/share/applications" "$PKG/usr/share/icons/hicolor/512x512/apps"
          for name in mini-term miniterm-hook mt-ssh-cli mt-ssh-mcp mt-terminal-host; do
            cp "target/release/$name" "$PKG/usr/lib/mini-term/"
          done
          ln -s ../lib/mini-term/mini-term "$PKG/usr/bin/mini-term"
          cp docs/icon.png "$PKG/usr/share/icons/hicolor/512x512/apps/mini-term.png"
          cat > "$PKG/usr/share/applications/mini-term.desktop" <<'DESKTOP'
          [Desktop Entry]
          Name=Mini-Term
          Exec=mini-term
          Icon=mini-term
          Type=Application
          Categories=Development;TerminalEmulator;
          DESKTOP
          cat > "$PKG/DEBIAN/control" <<CONTROL
          Package: mini-term
          Version: ${DEB_VERSION}
          Architecture: amd64
          Maintainer: mini-term
          Section: devel
          Priority: optional
          Description: Desktop terminal manager for the AI era
           Multi-project tabs, recursive split panes, AI process awareness.
          CONTROL
          # deb 的文件名用 DEB_VERSION(`-` 已换成 `~`),与包内 Version 字段一致；
          # 正式版两者本来就相同(1.1.0),预发布才看得出差别(1.1.0~beta)
          dpkg-deb --build --root-owner-group "$PKG" \
            "dist/Mini-Term_${DEB_VERSION}_amd64.deb"
          ls -la dist

      - name: Upload bundles to release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/Mini-Term_*-setup.exe
            dist/windows-package-validation.json
            dist/Mini-Term_*.dmg
            dist/Mini-Term_*.tar.gz
            dist/Mini-Term_*.deb
