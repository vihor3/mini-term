name: CI

on:
  push:
    branches-ignore:
      - 'dependabot/**'
    tags-ignore:
      - 'v*'
    paths-ignore:
      - '.agents/**'
      - '.claude/**'
      - '.trellis/**'
      - 'AGENTS.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve changed-file base
        id: diff-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          elif [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            base="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
          elif [ "$EVENT_NAME" = "push" ] && \
               [ -n "$PUSH_BEFORE_SHA" ] && \
               [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base="$PUSH_BEFORE_SHA"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            # workflow_dispatch on the default branch has no `before` SHA.
            # Check the selected revision's latest commit instead of treating
            # the entire repository history as new work.
            base="$(git rev-parse HEAD^)"
          else
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          git cat-file -e "$base^{commit}"
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      # Keep this list aligned with the Linux build job in release.yml. GPUI's
      # X11/Wayland backend and font/audio dependencies are required even for
      # check/test because mt-app is part of the workspace.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake pkg-config \
            libfontconfig1-dev libfreetype6-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcb1-dev libasound2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            sidecars -> target

      # The repository has historical rustfmt differences, including inside
      # files that new work may need to touch. Run rustfmt on changed files but
      # fail only when its diff intersects lines changed by this branch.
      - name: Check changed Rust formatting
        id: changed-rustfmt
        shell: bash
        env:
          RUSTFMT_PATCH_PATH: changed-rustfmt.patch
          RUSTFMT_FULL_PATCH_PATH: full-rustfmt.patch
        run: |
          node .github/scripts/check_changed_rustfmt.mjs \
            "${{ steps.diff-base.outputs.sha }}"

      - name: Upload rustfmt diagnostic patches
        if: ${{ failure() && hashFiles('changed-rustfmt.patch') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: rustfmt-diagnostics-${{ github.run_id }}
          path: |
            changed-rustfmt.patch
            full-rustfmt.patch
          if-no-files-found: error
          retention-days: 3

      - name: Check generated i18n dictionary
        if: ${{ !cancelled() }}
        id: generated-i18n
        shell: bash
        env:
          I18N_PATCH_PATH: generated-i18n.patch
        run: |
          node crates/mt-i18n/tools/gen_from_ts.mjs
          git diff --binary -- crates/mt-i18n/src/dict.rs > "$I18N_PATCH_PATH"
          if [ -s "$I18N_PATCH_PATH" ]; then
            cat "$I18N_PATCH_PATH"
            exit 1
          fi
          rm -f "$I18N_PATCH_PATH"

      - name: Upload generated i18n diagnostic patch
        if: ${{ failure() && hashFiles('generated-i18n.patch') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: generated-i18n-${{ github.run_id }}
          path: generated-i18n.patch
          if-no-files-found: error
          retention-days: 3

      - name: Test sidecar and ConPTY staging
        run: node --test tests/stageSidecars.test.cjs tests/conptyBundle.test.cjs

      - name: Verify locked Cargo graphs
        run: |
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          cargo metadata --manifest-path sidecars/Cargo.toml --locked --format-version 1 --no-deps > /dev/null

      - name: Cargo check
        run: cargo check --locked --workspace --all-targets

      - name: Sidecar check
        run: cargo check --manifest-path sidecars/Cargo.toml --locked --all-targets

      - name: Clippy affected packages
        shell: bash
        run: |
          base="${{ steps.diff-base.outputs.sha }}"
          set +e
          cargo clippy --locked --no-deps \
            -p mt-ai -p mt-app -p mt-config -p mt-github \
            -p mt-identity -p mt-layout -p mt-project -p mt-pty \
            -p mt-ssh -p mt-terminal -p mt-terminal-host -p mt-ui \
            --all-targets --message-format=json \
            | tee /tmp/clippy-messages.jsonl
          clippy_status=${PIPESTATUS[0]}
          set -e
          if [ "$clippy_status" -ne 0 ]; then
            exit "$clippy_status"
          fi
          node .github/scripts/check_changed_clippy.mjs \
            "$base" /tmp/clippy-messages.jsonl

      - name: Cargo test
        run: cargo test --locked --workspace --all-targets --no-fail-fast

      - name: Sidecar test
        run: cargo test --manifest-path sidecars/Cargo.toml --locked --all-targets

      - name: Whitespace check
        run: git diff --check "${{ steps.diff-base.outputs.sha }}" HEAD

  windows-msvc:
    name: Windows MSVC check
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            sidecars -> target

      - name: Verify locked Cargo graphs
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          cargo metadata --manifest-path sidecars/Cargo.toml --locked --format-version 1 --no-deps > /dev/null

      - name: Check affected root packages
        shell: bash
        run: |
          cargo check --locked --target x86_64-pc-windows-msvc --all-targets \
            -p mt-ai \
            -p mt-app \
            -p mt-config \
            -p mt-github \
            -p mt-identity \
            -p mt-layout \
            -p mt-project \
            -p mt-pty \
            -p mt-ssh \
            -p mt-terminal \
            -p mt-terminal-host \
            -p mt-ui

      - name: Run focused onboarding tests
        shell: bash
        run: |
          cargo test --locked --target x86_64-pc-windows-msvc \
            -p mt-app --bin mini-term --no-fail-fast \
            project_onboarding
          cargo test --locked --target x86_64-pc-windows-msvc \
            -p mt-app --bin mini-term --no-fail-fast \
            remote_ssh::project_ops

      - name: Check sidecars
        run: cargo check --manifest-path sidecars/Cargo.toml --locked --target x86_64-pc-windows-msvc --all-targets
