name: CI

on:
  push:
    branches-ignore:
      - 'dependabot/**'
    tags-ignore:
      - 'v*'
    paths-ignore:
      - '.agents/**'
      - '.claude/**'
      - '.trellis/**'
      - 'AGENTS.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve changed-file base
        id: diff-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          elif [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            base="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
          elif [ "$EVENT_NAME" = "push" ] && \
               [ -n "$PUSH_BEFORE_SHA" ] && \
               [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base="$PUSH_BEFORE_SHA"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            # workflow_dispatch on the default branch has no `before` SHA.
            # Check the selected revision's latest commit instead of treating
            # the entire repository history as new work.
            base="$(git rev-parse HEAD^)"
          else
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          git cat-file -e "$base^{commit}"
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      # Keep this list aligned with the Linux build job in release.yml. GPUI's
      # X11/Wayland backend and font/audio dependencies are required even for
      # check/test because mt-app is part of the workspace.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake pkg-config \
            libfontconfig1-dev libfreetype6-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcb1-dev libasound2-dev openssh-server

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Test changed Rust formatting diagnostics
        run: node --test tests/changedRustfmt.test.cjs

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            sidecars -> target

      # The repository has historical rustfmt differences, including inside
      # files that new work may need to touch. Run rustfmt on changed files but
      # fail only when its diff intersects lines changed by this branch.
      - name: Check changed Rust formatting
        id: changed-rustfmt
        shell: bash
        env:
          RUSTFMT_PATCH_PATH: changed-rustfmt.patch
          RUSTFMT_FULL_PATCH_PATH: full-rustfmt.patch
        run: |
          node .github/scripts/check_changed_rustfmt.mjs \
            "${{ steps.diff-base.outputs.sha }}"

      - name: Upload rustfmt diagnostic patches
        if: ${{ failure() && hashFiles('changed-rustfmt.patch') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: rustfmt-diagnostics-${{ github.run_id }}
          path: |
            changed-rustfmt.patch
            full-rustfmt.patch
          if-no-files-found: error
          retention-days: 3

      - name: Check generated i18n dictionary
        if: ${{ !cancelled() }}
        id: generated-i18n
        shell: bash
        env:
          I18N_PATCH_PATH: generated-i18n.patch
        run: |
          node crates/mt-i18n/tools/gen_from_ts.mjs
          git diff --binary -- crates/mt-i18n/src/dict.rs > "$I18N_PATCH_PATH"
          if [ -s "$I18N_PATCH_PATH" ]; then
            cat "$I18N_PATCH_PATH"
            exit 1
          fi
          rm -f "$I18N_PATCH_PATH"

      - name: Upload generated i18n diagnostic patch
        if: ${{ failure() && hashFiles('generated-i18n.patch') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: generated-i18n-${{ github.run_id }}
          path: generated-i18n.patch
          if-no-files-found: error
          retention-days: 3

      - name: Test sidecar and ConPTY staging
        run: node --test tests/stageSidecars.test.cjs tests/conptyBundle.test.cjs

      - name: Verify locked Cargo graphs
        run: |
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          cargo metadata --manifest-path sidecars/Cargo.toml --locked --format-version 1 --no-deps > /dev/null

      - name: Cargo check
        run: cargo check --locked --workspace --all-targets

      - name: Sidecar check
        run: cargo check --manifest-path sidecars/Cargo.toml --locked --all-targets

      - name: Clippy affected packages
        shell: bash
        run: |
          base="${{ steps.diff-base.outputs.sha }}"
          set +e
          cargo clippy --locked --no-deps \
            -p mt-ai -p mt-app -p mt-config -p mt-github \
            -p mt-identity -p mt-layout -p mt-project -p mt-pty \
            -p mt-ssh -p mt-terminal -p mt-terminal-host -p mt-ui \
            --all-targets --message-format=json \
            | tee /tmp/clippy-messages.jsonl
          clippy_status=${PIPESTATUS[0]}
          set -e
          if [ "$clippy_status" -ne 0 ]; then
            exit "$clippy_status"
          fi
          node .github/scripts/check_changed_clippy.mjs \
            "$base" /tmp/clippy-messages.jsonl

      - name: Cargo test
        run: cargo test --locked --workspace --all-targets --no-fail-fast

      - name: Test authenticated loopback SSH workflows
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          umask 077
          fixture=$(mktemp -d "$RUNNER_TEMP/mt-loopback-ssh.XXXXXXXX")
          cleanup() {
            status=$?
            trap - EXIT INT TERM
            set +e
            if [ -f "$fixture/sshd.pid" ]; then
              daemon=$(sudo cat "$fixture/sshd.pid")
              case "$daemon" in
                ''|*[!0-9]*) ;;
                *) sudo kill "$daemon" 2>/dev/null || true ;;
              esac
            fi
            rm -rf -- "$fixture"
            if [ "$?" -ne 0 ]; then
              exit 1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          port=22222
          user=$(id -un)
          mkdir -p "$fixture/client-home/.ssh" "$fixture/remote-home" "$fixture/bin"
          printf 'mini-term Actions loopback\n' > "$fixture/.fixture-only"
          ssh-keygen -q -t ed25519 -N '' -f "$fixture/client-key"
          ssh-keygen -q -t ed25519 -N '' -f "$fixture/host-key"
          cp "$fixture/client-key.pub" "$fixture/authorized_keys"
          printf '%s\n' \
            'ListenAddress 127.0.0.1' "Port $port" \
            "HostKey $fixture/host-key" "PidFile $fixture/sshd.pid" \
            "AuthorizedKeysFile $fixture/authorized_keys" "AllowUsers $user" \
            'PasswordAuthentication no' 'KbdInteractiveAuthentication no' \
            'PubkeyAuthentication yes' 'UsePAM yes' 'StrictModes yes' \
            'PermitUserRC no' 'PermitUserEnvironment no' 'DisableForwarding yes' \
            "Subsystem sftp internal-sftp -d $fixture/remote-home" 'LoginGraceTime 15' \
            "SetEnv HOME=$fixture/remote-home PATH=$fixture/bin:/usr/bin:/bin GIT_CONFIG_NOSYSTEM=1" \
            'SetEnv GH_TOKEN=inherited_fixture_secret GH_DEBUG=api DEBUG=1 GH_HOST=wrong.invalid GH_REPO=wrong/repo' \
            > "$fixture/sshd_config"
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -t -f "$fixture/sshd_config"
          sudo /usr/sbin/sshd -f "$fixture/sshd_config" -E "$fixture/sshd.log"
          export MT_TEST_SSH_ROOT="$fixture" MT_TEST_SSH_PORT="$port"
          export MT_TEST_SSH_USER="$user" MT_TEST_SSH_KEY="$fixture/client-key"
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export HOME="$fixture/client-home" GIT_CONFIG_NOSYSTEM=1
          run_fixture() {
            local test="$1" listing
            listing=$(timeout 5m cargo test --locked -p mt-app --bin mini-term \
              "$test" -- --list --ignored --exact)
            if [ "$(printf '%s\n' "$listing" | sed -n '/: test$/p')" != "$test: test" ]; then
              printf 'Expected exactly one ignored fixture: %s\n' "$test" >&2
              return 1
            fi
            timeout 5m cargo test --locked -p mt-app --bin mini-term \
              "$test" -- --ignored --exact --test-threads=1
          }
          run_fixture git_backend::tests::actions_fixtures::actual_loopback_ssh_git_backend_reads_writes_epoch_and_sftp_containment
          run_fixture git_backend::tests::actions_fixtures::actual_loopback_ssh_dispatched_timeout_keeps_ownership_until_explicit_review
          run_fixture remote_ssh::tasks_accounts::tasks_account_executor_ssh_sentinels_cleanup_and_epoch_pipeline
          run_fixture remote_ssh::transfer::epoch_tests::actual_loopback_sftp_files_pins_mutations_and_containment
          run_fixture remote_ssh::dirs::browser_tests::actual_loopback_sftp_browser_preserves_source_and_epoch

      - name: Sidecar test
        run: cargo test --manifest-path sidecars/Cargo.toml --locked --all-targets

      - name: Whitespace check
        run: git diff --check "${{ steps.diff-base.outputs.sha }}" HEAD

  windows-msvc:
    name: Windows MSVC check
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            sidecars -> target

      - name: Verify locked Cargo graphs
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          cargo metadata --manifest-path sidecars/Cargo.toml --locked --format-version 1 --no-deps > /dev/null

      - name: Check affected root packages
        shell: bash
        run: |
          cargo check --locked --target x86_64-pc-windows-msvc --all-targets \
            -p mt-ai \
            -p mt-app \
            -p mt-config \
            -p mt-github \
            -p mt-identity \
            -p mt-layout \
            -p mt-project \
            -p mt-pty \
            -p mt-ssh \
            -p mt-terminal \
            -p mt-terminal-host \
            -p mt-ui

      - name: Run focused onboarding tests
        shell: bash
        run: |
          cargo test --locked --target x86_64-pc-windows-msvc \
            -p mt-app --bin mini-term --no-fail-fast \
            project_onboarding
          cargo test --locked --target x86_64-pc-windows-msvc \
            -p mt-app --bin mini-term --no-fail-fast \
            remote_ssh::project_ops

      - name: Run file browser regressions
        shell: bash
        run: |
          cargo test --locked --target x86_64-pc-windows-msvc \
            -p mt-app --bin mini-term --no-fail-fast \
            file_tree::tests
          cargo test --locked --target x86_64-pc-windows-msvc \
            -p mt-app --bin mini-term --no-fail-fast \
            remote_directory_picker
          cargo test --locked --target x86_64-pc-windows-msvc \
            -p mt-app --bin mini-term --no-fail-fast \
            remote_ssh::transfer::epoch_tests
          cargo test --locked --target x86_64-pc-windows-msvc \
            -p mt-app --bin mini-term --no-fail-fast \
            remote_ssh::delete::epoch_tests

      - name: Run Tasks account isolation regressions
        shell: bash
        run: |
          execution_host_tests=$(cargo test --locked --target x86_64-pc-windows-msvc \
            -p mt-app --bin mini-term --no-fail-fast \
            execution_host:: -- --list)
          printf '%s\n' "$execution_host_tests"
          if [ -z "$(printf '%s\n' "$execution_host_tests" | sed -n '/^execution_host::.*: test[[:space:]]*$/p')" ]; then
            printf 'Expected execution_host module tests to be discovered\n' >&2
            exit 1
          fi
          cargo test --locked --target x86_64-pc-windows-msvc \
            -p mt-app --bin mini-term --no-fail-fast \
            execution_host::
          cargo test --locked --target x86_64-pc-windows-msvc \
            -p mt-app --bin mini-term --no-fail-fast \
            tasks_account_executor
          cargo test --locked --target x86_64-pc-windows-msvc \
            -p mt-app --bin mini-term --no-fail-fast \
            github_tasks
          cargo test --locked --target x86_64-pc-windows-msvc \
            -p mt-config --no-fail-fast tasks_account_choices
          cargo test --locked --target x86_64-pc-windows-msvc \
            -p mt-github --lib --no-fail-fast

      - name: Run Git host and panel regressions
        shell: bash
        run: |
          cargo test --locked --target x86_64-pc-windows-msvc \
            -p mt-project --lib --no-fail-fast git::cli
          cargo test --locked --target x86_64-pc-windows-msvc \
            -p mt-project --lib --no-fail-fast git::local
          cargo test --locked --target x86_64-pc-windows-msvc \
            -p mt-app --bin mini-term --no-fail-fast git_

      - name: Check sidecars
        run: cargo check --manifest-path sidecars/Cargo.toml --locked --target x86_64-pc-windows-msvc --all-targets

      - name: Run terminal host regressions
        run: cargo test --locked --target x86_64-pc-windows-msvc -p mt-terminal-host --all-targets --no-fail-fast

  tasks-wsl-rootfs:
    name: Prepare isolated Tasks WSL fixture
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare checksum-pinned synthetic gh rootfs
        run: node .github/scripts/tasks_wsl_fixture.mjs prepare
      - uses: actions/upload-artifact@v7
        with:
          name: tasks-wsl-rootfs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mt-tasks-rootfs-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          compression-level: 3
          retention-days: 1

  tasks-wsl:
    name: Tasks actual WSL transport
    needs: tasks-wsl-rootfs
    # This image explicitly provides WSL 1. Do not silently replace this gate
    # with a POSIX-envelope test or a distro belonging to the runner image.
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: . -> target
      - uses: actions/download-artifact@v8
        with:
          name: tasks-wsl-rootfs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mt-tasks-rootfs-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Import only the same-run isolated WSL fixture
        run: node .github/scripts/tasks_wsl_fixture.mjs import
      - name: Discover and run the exact actual WSL transport test
        timeout-minutes: 60
        run: node .github/scripts/tasks_wsl_fixture.mjs test
      - name: Remove only this run's disposable WSL distro
        if: ${{ always() }}
        timeout-minutes: 10
        run: node .github/scripts/tasks_wsl_fixture.mjs cleanup
